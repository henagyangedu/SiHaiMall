# 每次推送到主分支、每个 Pull Request 自动跑：后端测试、界面文案检查、三个前端的构建。
# 浏览器点击测试（e2e/）要先起三个前端和一个有数据的开发库，不在这里跑。
name: 检查

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: gmmall_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: home
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, pdo_mysql, openssl, fileinfo, curl
          coverage: none
      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: 准备配置
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: 运行测试
        # 测试库名在 phpunit.xml 里固定为 gmmall_test；地址和账号取 .env（127.0.0.1、root、空密码）
        run: php artisan test

  locale:
    name: 界面文案检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 核对各语言的文案
        # 这个脚本只读文案文件，不需要安装依赖
        run: node mall-uni/scripts/check-locale.mjs

  frontend:
    name: 构建 ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: 管理后台, dir: admin-web, build: 'npm run build' }
          - { name: PC 端, dir: mall-pc, build: 'npm run build' }
          - { name: 手机端 H5 和小程序, dir: mall-uni, build: 'npm run build:h5 && npm run build:mp-weixin' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app.dir }}/package-lock.json
      - name: 安装依赖
        working-directory: ${{ matrix.app.dir }}
        run: npm ci
      # PC 端引用了手机端目录下共用的文案和工具（@shared），其中用到 vue-i18n 等依赖，由 PC 端自己的 node_modules 提供
      - name: 构建
        working-directory: ${{ matrix.app.dir }}
        run: ${{ matrix.app.build }}
